<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-beauty Trend Radar</title>
<meta name="description" content="미국 K-뷰티 시장 주간 트렌드 대시보드 — SNS·리테일 데이터 기반, LLM 인사이트 자동 검증">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">K-beauty<br><span>Trend Radar</span><p class="brand-desc">미국 SNS·리테일 데이터로 매주 뜨는 K-뷰티 니즈와 그 대화를 잡은 브랜드를 보여 주는 대시보드</p></div>
    <nav id="nav">
      <a data-page="overview" data-track="tab_view">개요</a>
      <a data-page="trends" data-track="tab_view">트렌드</a>
      <a data-page="brands" data-track="tab_view">브랜드</a>
      <a data-page="products" data-track="tab_view">제품 전략</a>
      <a data-page="inbound" data-track="tab_view">방한 추천</a>
      <a data-page="quality" data-track="tab_view">검증·품질</a>
      <a data-page="method" data-track="tab_view">방법론</a>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main>
    <header class="top">
      <div>
        <h1 id="pageTitle">개요</h1>
        <div class="page-desc" id="pageDesc"></div>
        <div class="sub" id="periodLabel"></div>
      </div>
      <div class="controls">
        <div class="seg" id="modeSeg">
          <button data-mode="week" data-track="period_change">주간</button>
          <button data-mode="month" data-track="period_change">월간</button>
        </div>
        <select id="periodSelect" aria-label="기간 선택" data-track="period_change"></select>
        <span class="badge" id="trustBadge"></span>
      </div>
    </header>
    <div id="banner"></div>
    <div id="content"></div>
  </main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
